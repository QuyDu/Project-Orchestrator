<section class="live-chat-panel" aria-labelledby="live-chat-title" data-live-chat>
  <h2 id="live-chat-title">Live chat</h2>
  <p aria-live="polite" data-live-chat-status>Consent is required before voice input.</p>
  <label for="live-chat-text">Message</label>
  <textarea id="live-chat-text" data-live-chat-input rows="3"></textarea>
  <div class="live-chat-actions">
    <button type="button" data-live-chat-microphone>Microphone</button>
    <button type="button" data-live-chat-cancel>Cancel</button>
  </div>
  <p class="text-fallback" data-live-chat-fallback hidden>Text fallback is available.</p>
  <p class="guided-fallback" data-live-chat-guided hidden>Guided fallback is available.</p>
</section>
