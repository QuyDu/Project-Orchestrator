name: Security validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    name: Gitleaks full history / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use maintained Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          check-latest: true
      - name: Install pinned Gitleaks with checksum verification
        run: npm run security:gitleaks:install
      - name: Verify current, staged, report, history, and redaction fixtures
        run: npm run test:gitleaks
      - name: Scan worktree, reports, refs, and reachable history
        run: npm run security:gitleaks
      - name: Upload sanitized scanner evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-evidence-${{ runner.os }}-${{ github.sha }}
          path: reports/gitleaks-scan.json
          if-no-files-found: error
          retention-days: 90

  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use maintained Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Validate locked dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run syntax, contracts, security fixtures, and verification
        run: npm run check
      - name: Record successful matrix evidence
        run: node scripts/ci-evidence.mjs record --os "${{ runner.os }}" --node "${{ matrix.node }}" --commit "${{ github.sha }}" --output "reports/ci-runs/${{ runner.os }}-${{ matrix.node }}.json"
      - name: Upload matrix evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ runner.os }}-${{ matrix.node }}
          path: reports/ci-runs/*.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: Aggregate cross-platform evidence
    needs: [check, secret-history]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use maintained Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          check-latest: true
      - name: Download matrix evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-*
          path: reports/ci-download
          merge-multiple: true
      - name: Aggregate evidence
        run: node scripts/ci-evidence.mjs aggregate --input reports/ci-download --output reports/cross-platform-ci-evidence.json --commit "${{ github.sha }}"
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-platform-ci-evidence
          path: reports/cross-platform-ci-evidence.json
          if-no-files-found: error
          retention-days: 90